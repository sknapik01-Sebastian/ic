#app .row-hv:hover { background: var(--hv) !important; }
#app .chip-hv:hover, #app .card-hv:hover { border-color: var(--hvline) !important; }
#app .card-hv { transition: border-color .12s ease, box-shadow .12s ease; }
#app .btn-hv:hover { filter: brightness(0.96); }
#app .icon-hv:hover { background: var(--hv) !important; }
#app .seg-hv[aria-checked="false"]:hover { background: var(--hv) !important; }
#app .rail-hv[aria-current="false"]:hover > span:first-child { background: var(--hv) !important; }

<body>
<div id="stage"><div id="app"></div></div>
<template id="app-tpl">
<div style="--hv: {{hv}}; --hvline: {{t.outline}}; position: relative; width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: {{t.app}}; color-scheme: {{t.scheme}}; font-family: Manrope, 'Segoe UI', sans-serif; color: {{t.ink}}">

<div style="height: 56px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; background: linear-gradient(90deg, #0A0F26 0%, #14155A 58%, #241B5C 100%); color: #FFFFFF">
<div style="position: relative; display: flex; align-items: center; padding-left: 14px">
<button type="button" data-act="proto" aria-haspopup="menu" aria-expanded="{{protoOpen}}" style="height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 11px 0 12px; border-radius: 15px; border: 1px dashed rgba(255,255,255,0.45); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.92); font-family: inherit; font-size: 12px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg>Prototype · screens<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{protoOpen}}">
<div data-keep="1" role="menu" aria-label="Prototype screens" style="position: absolute; top: 44px; left: 14px; z-index: 60; width: 360px; padding: 10px; box-sizing: border-box; border-radius: 12px; background: #141833; border: 1px solid #2B3160; box-shadow: 0 18px 44px rgba(0,0,0,0.35); color: #EEF0FA">
<div style="padding: 4px 8px 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #9CA3C2">Jump to a design state</div>
<sc-for list="{{protoScreens}}" as="p">
<button type="button" role="menuitem" data-act="preset" data-i="{{p.i}}" class="hv-dark" style="width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font-family: inherit; text-align: left; color: #EEF0FA"><span style="min-width: 26px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 5px; background: #2A3060; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{p.n}}</span><span style="font-size: 13px; font-weight: 600">{{p.label}}</span></button>
</sc-for>
<div style="margin: 8px 0; height: 1px; background: #2B3160"></div>
<div style="padding: 2px 8px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #9CA3C2">Admin banners</div>
<sc-for list="{{protoBanners}}" as="b">
<button type="button" role="menuitemcheckbox" data-act="banner" data-b="{{b.key}}" class="hv-dark" style="width: 100%; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font-family: inherit; text-align: left; color: #EEF0FA"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid {{b.boxBd}}; background: {{b.box}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1128" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.check}}"></path></svg></span><span style="font-size: 13px; font-weight: 600">{{b.label}}</span></button>
</sc-for>
<div style="margin: 8px 0; height: 1px; background: #2B3160"></div>
<button type="button" data-act="reset" class="hv-dark" style="width: 100%; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font-family: inherit; text-align: left; color: #EEF0FA"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"></path></svg><span style="font-size: 13px; font-weight: 600">Reset prototype data</span></button>
<p style="margin: 8px 8px 2px; font-size: 11.5px; line-height: 1.45; color: #9CA3C2">Prototype helper only — not part of the app UI. Esc closes menus and the right sidebar.</p>
</div>
</sc-if>
</div>
<nav aria-label="Pinned apps" style="display: flex; align-items: stretch">
<sc-for list="{{pinned}}" as="f" hint-placeholder-count="3">
<button type="button" data-act="launch" data-id="{{f.id}}" class="pin-hv" title="{{f.title}}" style="position: relative; width: 116px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0; border: none; background: transparent; color: rgba(255,255,255,0.86); font-family: inherit">
<span style="position: relative; display: block; width: 22px; height: 22px">
<span style="position: relative; display: block; width: {{f.ic.s}}; height: {{f.ic.s}}; border-radius: {{f.ic.r}}; border: 1px solid rgba(255,255,255,0.35); background: #FFFFFF; box-sizing: border-box; overflow: hidden"><span style="display: flex; align-items: center; justify-content: center; height: {{f.ic.band}}; background: {{f.ic.color}}; border-bottom: 1px solid {{f.ic.line}}; color: #FFFFFF; font-size: {{f.ic.fs}}; font-weight: 800; line-height: 1">{{f.ic.label}}</span><span class="ic-mark" style="position: absolute; right: {{f.ic.mOff}}; bottom: {{f.ic.mOff}}; width: {{f.ic.m}}; height: {{f.ic.m}}; background: {{f.ic.markColor}}"></span></span>
<sc-if value="{{f.bubble}}" ><span style="position: absolute; top: -6px; right: -10px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #FF8A1F; border: 1.5px solid #14155A; color: #FFFFFF; font-size: 8.5px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span></sc-if>

<sc-for list="{{favGroups}}" as="g" hint-placeholder-count="2">
<div style="padding: 14px 16px; border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.line}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 14px; font-weight: 800">{{g.title}}</span>
<span style="font-size: 11px; font-weight: 700; color: {{t.chipText}}; background: {{t.chip}}; border-radius: 9px; padding: 1px 7px">{{g.count}}</span>
<span style="flex-grow: 1"></span>
<button type="button" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 700; color: {{t.link}}" data-act="nav" data-to="software">{{g.link}}</button>
</div>
<div style="display: flex; gap: 10px; min-width: 0">
<sc-if value="{{g.empty}}"><span style="height: 42px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: {{t.muted}}">No favourite software yet — use the star on any app to add it here.</span></sc-if>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
<button type="button" data-act="select" data-id="{{i.id}}" data-from="fav" class="chip-hv" aria-pressed="{{i.on}}" style="min-width: 0; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 6px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.card2}}; box-shadow: {{i.ring}}; box-sizing: border-box; font-family: inherit; text-align: left; color: {{t.ink}}">
<sc-if value="{{i.isSw}}" ><span style="position: relative; display: block; flex-shrink: 0; width: {{i.ic.s}}; height: {{i.ic.s}}; border-radius: {{i.ic.r}}; border: 1px solid #E3E5EA; background: #FFFFFF; box-sizing: border-box; overflow: hidden"><span style="display: flex; align-items: center; justify-content: center; height: {{i.ic.band}}; background: {{i.ic.color}}; border-bottom: 1px solid {{i.ic.line}}; color: #FFFFFF; font-size: {{i.ic.fs}}; font-weight: 800; line-height: 1">{{i.ic.label}}</span><span class="ic-mark" style="position: absolute; right: {{i.ic.mOff}}; bottom: {{i.ic.mOff}}; width: {{i.ic.m}}; height: {{i.ic.m}}; background: {{i.ic.markColor}}"></span></span></sc-if>
<sc-if value="{{i.isProduct}}" ><span style="width: 30px; height: 30px; border-radius: 6px; background: {{t.hatch}}; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: {{t.mono}}">{{i.mono}}</span></sc-if>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.name}}</span><span style="font-size: 11.5px; font-weight: 600; color: {{i.subColor}}; white-space: nowrap">{{i.sub}}</span></span>
<sc-if value="{{i.isSw}}" ><span style="margin-left: 6px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: {{i.licFg}}; background: {{i.licBg}}; border: 1px solid {{i.licBd}}; border-radius: 5px; padding: 2px 7px">{{i.license}}</span></sc-if>
</button>
</sc-for>
</div>

</sc-for>

<button type="button" role="tab" data-act="tab" data-i="{{x.i}}" aria-selected="{{x.on}}" style="padding: 10px 0; margin-bottom: -1px; border: none; border-bottom: 2px solid {{x.line}}; background: transparent; color: {{x.c}}; font-family: inherit; font-size: 14px; font-weight: {{x.w}}">{{x.label}}</button>
</sc-for>
</div>

<span style="font-size: 11px; font-weight: 700; color: {{f.tagFg}}; background: {{f.tagBg}}; border-radius: 5px; padding: 3px 7px">{{f.tag}}</span>
<span style="flex-grow: 1"></span>

    case 'collapse': S.prodOpen = false; break;
    case 'cat': go('category', { keepProducts: true }); S.catName = el.getAttribute('data-name'); S.l1 = 0; S.l2 = 0; S.prodOpen = true; break;
    case 'l1': S.l1 = +el.getAttribute('data-i'); S.l2 = 0; S.selectedId = null; break;
    case 'l2': S.l2 = +el.getAttribute('data-i'); S.selectedId = null; break;
    case 'select':
      var from = el.getAttribute('data-from');
      if (S.selectedId === id && S.selFrom === from) { S.selectedId = null; S.selFrom = null; }
      else { S.selectedId = id; S.selFrom = from; }
      S.acctOpen = false;
      break;
    case 'close-panel': S.selectedId = null; S.selFrom = null; break;
    case 'details': go('details'); S.detailsId = id; break;
    case 'tab': S.featTab = +el.getAttribute('data-i'); break;
    case 'fav': toggleFav(id); break;
    case 'pin': togglePin(id); break;
    case 'action': swAction(id); break;
    case 'launch': toast('Launching ' + SW[id].name + '…'); break;
    case 'pin-add': go('software'); S.swMode = 'all'; toast('Use the pin icon next to an installed app to add it to the top bar'); break;
    case 'shortcut': toast('Shortcut to ' + SW[id].name + ' created on the desktop'); break;
    case 'share': toast('Link copied to clipboard'); break;
    case 'uninstall': S.confirm = { id: id, title: 'Uninstall ' + SW[id].name + '?', text: 'The application will be removed from this computer. Your projects and settings stay untouched.' }; break;
    case 'confirm-yes':
      var cid = S.confirm.id; S.confirm = null;
      S.sw[cid] = { status: 'not' };
      var pi = S.pinned.indexOf(cid); if (pi >= 0) S.pinned.splice(pi, 1);
      toast(SW[cid].name + ' has been uninstalled');
      break;
    case 'confirm-no': S.confirm = null; break;
    case 'dl':
      if (PR[id]) saveOffline(PR[id].name + ' – product files', 'Product files · ' + PR[id].family);
      else if (DOC[id]) saveOffline(DOC[id].name, 'PDF · ' + DOC[id].related);
      break;
    case 'dl-doc': saveOffline(el.getAttribute('data-key'), 'PDF · ' + SW[S.detailsId].name); break;
    case 'offline-rm':
      var o = S.offline.splice(+el.getAttribute('data-i'), 1)[0]; if (o) delete S.saved[o.name]; toast('Removed from My offline files'); break;
    case 'ext': toast('Opens the product page on ismacontrolli.com'); break;
    case 'open-doc': toast('Opening ' + DOC[id].name + '…'); break;
    case 'hide':
      var hb = el.getAttribute('data-b'); S.banners[hb] = false; toast('Hidden for today'); break;
    case 'theme': S.theme = el.getAttribute('data-v'); break;
    case 'acct': S.acctOpen = !S.acctOpen; break;
    case 'search': doSearch(); break;
    case 'zoom': var dz = el.getAttribute('data-d') === '+' ? 10 : -10; S.zoom = Math.max(80, Math.min(150, S.zoom + dz)); toast('Interface zoom ' + S.zoom + '%'); break;
    case 'toast': toast(el.getAttribute('data-msg')); break;
    case 'win': toast('Window control of the desktop app'); break;
    case 'none': return;
    default: return;
  }
  render();
}
function doSearch() {
  var q = document.getElementById('q');
  S.query = q ? q.value : S.query;
  if (!S.query.trim()) { toast('Type a name, e.g. “Configurator”'); return; }
  go('software', { force: true }); S.swMode = 'search';
}

function onClick(e) {
  var el = e.target.closest('[data-act]');
  var inKeep = e.target.closest('[data-keep]');
  var changed = false;
  if (S.acctOpen && !inKeep && !(el && el.getAttribute('data-act') === 'acct')) { S.acctOpen = false; changed = true; }
  if (S.protoOpen && !inKeep && !(el && el.getAttribute('data-act') === 'proto')) { S.protoOpen = false; changed = true; }
  if (el && ROOT.contains(el)) { handle(el, e); return; }
  if (changed) render();
}

/* ------------------------------------------------------------------ */
/*  Boot                                                               */
/* ------------------------------------------------------------------ */
function fit() {
  var st = document.getElementById('stage');
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  st.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
document.addEventListener('DOMContentLoaded', function () {
  TPL = document.getElementById('app-tpl');
  ROOT = document.getElementById('app');
  ROOT.addEventListener('click', onClick);
  ROOT.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'q' && e.key === 'Enter') { e.preventDefault(); doSearch(); render(); }
  });
  ROOT.addEventListener('input', function (e) { if (e.target && e.target.id === 'q') S.query = e.target.value; });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); var q = document.getElementById('q'); if (q) q.focus(); return; }
    if (e.key === 'Escape') {
      if (S.confirm) S.confirm = null; else if (S.acctOpen) S.acctOpen = false; else if (S.protoOpen) S.protoOpen = false; else if (S.selectedId) S.selectedId = null; else return;
      render();
    }
  });
  window.addEventListener('resize', fit);
  fit();
  render();
});
})();

</script>
</body>
